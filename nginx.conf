server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 한글 페이지다 — Content-Type 에 charset 을 박아 브라우저가 UTF-8 로 읽게 한다
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # 페이지가 하나다 — 어떤 경로로 와도 index.html 을 준다(옛 링크·오타가 hr 로 새던 것을 여기서 받는다)
    location / {
        try_files $uri /index.html;
    }

    # 화면 캡처·사진은 오래 캐시한다 — 바뀌면 파일명이 아니라 배포로 갈리므로 하루면 충분하다
    location /img/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # index.html 은 캐시하지 않는다 — 배포 직후 바로 바뀌어야 한다
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
